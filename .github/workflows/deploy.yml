name: Release

# A release is a commit on main that changes "version" in the root package.json.
# This workflow builds that commit, publishes it to GitHub Pages and then creates
# the matching tag (v<version>). Tags are created here because the build agent's
# git access cannot push tags. Run it by hand to redeploy the current version.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      is_new: ${{ steps.version.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: version
        name: Read version
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      # Tries to switch Pages on for the repository. If the token is not allowed to,
      # this step fails with "Pages not enabled": enable it once under
      # Settings > Pages > Source = GitHub Actions, then re-run this workflow.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    if: needs.build.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  tag:
    needs: [build, deploy]
    if: needs.build.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create tag
        run: |
          git tag "${{ needs.build.outputs.tag }}"
          git push origin "${{ needs.build.outputs.tag }}"
