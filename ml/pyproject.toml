[project]
name = "fretlume-ml"
version = "0.0.0"
description = "Synthetic data, training, export and evaluation for Fretlume's vision models"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
]

# Training only (`uv run --group train …`); not installed by default, so CI and fixtures stay light.
[dependency-groups]
train = [
  "torch>=2.5",
]

[tool.uv]
package = false
